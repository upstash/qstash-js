name: CI

on:
  pull_request:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

# E2E suites share an account and perform account-wide cleanup.
# Queue across branches so one run cannot delete another run's fixtures.
concurrency:
  group: qstash-ci-shared-account
  queue: max

jobs:
  tests:
    if: github.event_name != 'release'
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  release:
    if: github.event_name == 'release'
    uses: ./.github/workflows/release.yml
    with:
      prerelease: ${{ github.event.release.prerelease }}
    secrets: inherit
